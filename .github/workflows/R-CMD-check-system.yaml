# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: R-CMD-check (system)

on:
  push:
    branches: [main, devel, fix_check]
  pull_request:
    branches: [devel]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: true
      matrix:
        config:
          # ignore macos and windows for now
          # - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
        
          # Ubuntu
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: ubuntu-latest,   r: 'oldrel-2'}
          - {os: ubuntu-latest,   r: 'oldrel-3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install TA-Lib (Unix)
        if: runner.os != 'windows'
        run: |
          curl -sSL -o ta-lib_0.6.4_amd64.deb \
            https://github.com/TA-Lib/ta-lib/releases/download/v0.6.4/ta-lib_0.6.4_amd64.deb
          sudo dpkg -i ta-lib_0.6.4_amd64.deb || sudo apt-get -y -f install

      - name: Install TA-Lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/TA-Lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-windows-x86_64.msi'
          $msi = "$env:RUNNER_TEMP\ta-lib.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait

          $root = 'C:\Program Files\TA-Lib'
          echo "TA_LIB_ROOT=$root"                 >> $env:GITHUB_ENV
          echo "TA_INCLUDE_DIR=$root\include"      >> $env:GITHUB_ENV
          echo "TA_LIBRARY_DIR=$root\lib"          >> $env:GITHUB_ENV
          echo "INCLUDE=$env:INCLUDE;$root\include" >> $env:GITHUB_ENV
          echo "LIB=$env:LIB;$root\lib"            >> $env:GITHUB_ENV
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
