name: Validate TA-Lib Core

on:
  push:
    branches: [devel, unit-tests]
  pull_request:
    branches: [devel, unit-tests]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools any::roxygen2
          needs: check

      - name: Build TA-Lib (vendored)
        run: |
          cmake -S src/ta-lib -B /tmp/talib-build \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/src/ta-lib/local \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-O2 -fPIC -DNDEBUG"
          cmake --build /tmp/talib-build --target install

      - name: Install R package
        run: |
          devtools::document()
          install.packages(".", repos = NULL, type = "source")
        shell: Rscript {0}

      - name: Compile validation library
        run: |
          PKG_CFLAGS="-Isrc/ta-lib/local/include -Isrc/ta-lib/local/include/ta-lib" \
          PKG_LIBS="src/ta-lib/local/lib/libta-lib.a -lm" \
          R CMD SHLIB tools/validation/validate.c

      - name: Run validation
        run: Rscript tools/validation/validate.R
