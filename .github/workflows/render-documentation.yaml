## Workflow: Render Documentation
## objective:
##    - Render *.Rd-files on CRAN-branch which has the CRAN version
##      of the package *and* the R-universe version.
##
name: Render Documentation

## the workflow is called once by ci.yaml,
## release.yaml and rhub.yaml, and gates their
## remaining jobs. Only a caller passing `push: true`
## pushes the *.Rd-files, and only on push events
on:
  workflow_call:
    inputs:
      push:
        description: 'Push the rendered documentation to the CRAN branch'
        type: boolean
        default: false
  workflow_dispatch:

## permissions are inherited from
## the caller; pushing requires the
## caller to grant `contents: write`
jobs:
  render-documentation:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools any::roxygen2

      - name: Render documentation and NAMESPACE
        run: devtools::document()
        shell: Rscript {0}

      ## *.Rd-files are untracked, so the
      ## called workflows download them from here
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            man/
            NAMESPACE

      - name: Push documentation
        id: push
        if: inputs.push && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f man/ NAMESPACE
          if git diff --cached --quiet; then
            echo "No documentation changes - nothing to commit."
          else
            git commit -m ":books: Rendered documentation"
            git push origin CRAN
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
