url: https://serkor1.github.io/ta-lib-R/
home:
  title: R bindings for TA-Lib
  description: |
    {talib}: R bindings for TA-Lib. Technical Analysis indicators and Candlestick pattern recognition.
navbar:
  inverse: yes
template:
  bootstrap: 5
  light-switch: yes
  bslib:
    primary: '#0054AD'
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: '#A6081A'
reference:
- title: Candlestick Patterns
  desc: |
    The collection of Candlestick Patterns. 
- contents: has_concept('Pattern Recognition')
- title: Momentum Indicators
  desc: |
    The collection of Momentum Indicators.
- contents: has_concept('Momentum Indicator')
- title: Overlap Studies
  desc: |
    The collection of Overlap Studies.
- contents: has_concept('Overlap Study')
- title: Cycle Indicators
  desc: |
    The collection of Cycle Indicators.
- contents: has_concept('Cycle Indicator')
- title: Volume Indicators
  desc: |
    The collection of Volume Indicators.
- contents: has_concept('Volume Indicator')
- title: Volatility Indicators
  desc: |
    The collection of Volatility Indicators.
- contents: has_concept('Volatility Indicator')
- title: Financial Charts
  desc: |
    Charting functions
  contents:
  - chart
  - indicator
- title: Rolling Statistics
  desc: |
    The collection of Rolling Statistics. 
- contents: has_concept('Rolling Statistic')
- title: Price Transformations
  desc: |
    The collection of Price Transformation. 
- contents: has_concept('Price Transform')
- title: Financial Data
  desc: |
    Preloaded financial data
  contents:
  - BTC
  - SPY
  - NVDA

